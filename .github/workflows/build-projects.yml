name: build-project-catalog

on:
  push:
    paths:
      - data/replies.json
      - parser.js
      - scripts/build-projects.mjs
      - scripts/summarize-projects.mjs
      - .github/workflows/build-projects.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-project-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build project catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-projects.mjs

      - name: Generate incremental project summaries
        env:
          LLM_BASE_URL: https://moyuu.cc/v1
          LLM_API_KEY: ${{ secrets.MOYUU_API_KEY }}
          LLM_MODELS: gpt-5.6-luna,gpt-5.6-sol
        run: node scripts/summarize-projects.mjs

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/summaries.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "chore: refresh project catalog"
            git push
          fi
