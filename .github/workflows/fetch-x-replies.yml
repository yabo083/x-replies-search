name: fetch-x-replies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-x-replies
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch replies from X
        run: node server-fetch.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/replies.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 更新 X 回复快照 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
